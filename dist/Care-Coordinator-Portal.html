        e.target.tagName, String(e.target.src || e.target.href || ''));

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // upward at all. That last rule is load-bearing: the artifact host's

    // opaque contexts — file:// — everything serializes as 'null', where

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // and sender identity (own child frame / direct parent) is checked

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const resourceBlobs = {};

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n.'],['Coordinator','Obtain the existing plan, arrange assessments, confirm who provides follow-up.']],\n  evidence:'Diagnosis, treatment decision, named clinician and first follow-up are documented.',follow:'Treatment start ≤ 4 weeks',signals:['NEW_DX']},\n {id:'WHO-2',set:'WHO',n:2,stage:0,title:'Diabetes diagnosis and entry into care',trigger:'A raised glucose result or a newly reported diagnosis of diabetes requires confirmation and a continuing-care plan.',assess:'Check the recorded diagnosis, classification, current clinician, medicines and care already arranged.',\n  care:[['FPG ≥ 7.0 mmol/L, 2-h PG ≥ 11.1 mmol/L, or HbA1c ≥ 6.5%.','HEARTS-D Table 3, p13'],['Asymptomatic: repeat the test on a subsequent day to confirm.','HEARTS-D Section 1, p13'],['Glucose ≥ 18 mmol/L or symptoms: measure urine ketones.','HEARTS-D Section 1, p13']],\n  roles:[['Registered nurse','Assess symptoms, understanding, current care and barriers.'],['Doctor','Confirm diagnosis and agree goals.'],['Coordinator','Arrange assessments and first follow-up.']],\n  evidence:'Diagnostic decision, named clinician, agreed goals, required assessments and first follow-up documented. Outstanding care remains visible.',follow:'Confirm on a subsequent day',signals:['NEW_DX']},\n {id:'WHO-3',set:'WHO',n:3,stage:1,urgent:true,title:'Hypoglycaemia: treatment and subsequent review',trigger:'Low glucose or symptoms suggesting hypoglycaemia.',assess:'Establish glucose, symptoms, consciousness, ability to swallow safely, current medicines and treatment already given.',\n  care:[['Manage plasma glucose ≤ 3.9 mmol/L even without symptoms.','HEARTS-D Table 4, p18'],['Symptoms: headache, hunger, irritability, palpitations. Signs: sweating, trembling, confusion, seizures.','HEARTS-D Table 4, p18']],\n  roles:[['Registered nurse','Maintain live assessment and arrange the clinical response.'],['Doctor / emergency team','Assess severity, direct treatment or transfer.'],['Pharmacist','Medicine reconciliation and rescue-treatment access.']],\n  evidence:'Response to treatment documented; unresolved hypoglycaemia referred; recurrence prevention and follow-up arranged.',follow:'Same session',signals:['HYPO']},\n {id:'WHO-4',set:'WHO',n:4,stage:1,urgent:true,title:'Suspected DKA or HHS',trigger:'Illness with hyperglycaemia, or symptoms raising concern about DKA or HHS.',assess:'Assess current symptoms, clinical state, measurements and location. Establish the receiving service.',\n  care:[['Refer to hospital all patients with suspected DKA or HHS.','HEARTS-D Section 3, p20'],['Glucose > 18 mmol/L with ketones 2+: IV 0.9% NaCl and refer.','HEARTS-D Fig. 2, p25']],\n  roles:[['Registered nurse','Communicate findings directly to the responsible doctor.'],['Doctor','Direct treatment and referral.'],['Coordinator','Support handover; obtain the receiving-service outcome.']],\n  evidence:'Receiving service accepted the handover; outcome and next responsibilities documented.',follow:'Immediate',signals:[]},\n {id:'WHO-5',set:'WHO',n:5,stage:1,urgent:true,title:'Findings requiring same-day referral',trigger:'A finding in the WHO same-day referral list is identified.',assess:'Assess symptoms, clinical state, measurements and location. Establish the receiving service.',\n  care:[['BP > 200/110, or > 180/110 with headache, breathlessness, blurred vision, confusion, vomiting or reduced urine.','HEARTS-D Section 4, p26'],['Anuria or eGFR < 30; infected foot ulcer, gangrene, critical limb ischaemia.','HEARTS-D Section 4, p26'],['Chest pain or stroke signs; recent deterioration of vision.','HEARTS-D Section 4, p26']],\n  roles:[['Registered nurse','Assess and communicate directly to the responsible doctor.'],['Doctor','Direct referral; confirm receiving service.'],['Coordinator','Support handover and obtain the outcome.']],\n  evidence:'Receiving service accepted the handover; outcome and next responsibilities documented.',follow:'Same day',signals:['BP_URGENT','EGFR_CRITICAL']},\n {id:'WHO-6',set:'WHO',n:6,stage:3,title:'Baseline assessment when treatment starts',trigger:'Blood pressure treatment is starting and the baseline assessment is due or incomplete.',assess:'Check diagnosis, clinician, medicines and recent assessment.',\n  care:[['Electrolytes, creatinine, lipids, HbA1c or FPG, urine dipstick, ECG — only when testing does not delay treatment.','WHO conditional · Rec 2, p8'],['CVD risk assessment at or after initiation where feasible.','WHO conditional · Rec 3, p10']],\n  roles:[['Registered nurse','Obtain current measurements.'],['Doctor','Agree goals and plan.'],['Coordinator','Arrange authorised assessments.']],\n  evidence:'Diagnostic decision, named clinician, goals, required assessments and first follow-up documented.',follow:'At initiation',signals:[]},\n {id:'WHO-7',set:'WHO',n:7,stage:2,title:'Diabetes care, nutrition and self-management',trigger:'Diabetes or hypertension diagnosed, support needs change, or planned nutrition and self-management care is due.',assess:'Establish prior education, goals, food access, language and learning needs and medication-related risks.',\n  care:[['Healthy diet and regular activity are the mainstay of management.','HEARTS-D Section 2, p14'],['≥150 min/week moderate activity over ≥3 days.','HEARTS-D Section 2, p14']],\n  roles:[['Dietitian','Individualised nutrition assessment and therapy.'],['Registered nurse','Reinforce self-management and monitoring.'],['Pharmacist','Medicine-use counselling.'],['Coordinator','Arrange the service and confirm delivery.']],\n  evidence:'Education delivered, content and understanding documented, individual follow-up agreed. Sending material alone does not establish this.',follow:'Individual plan',signals:['HBA1C_ABOVE_GOAL']},\n {id:'WHO-8',set:'WHO',n:8,stage:4,title:'Blood pressure review and continuing follow-up',trigger:'BP is unknown, a reading needs confirmation, or confirmed BP requires a treatment review in a person with diabetes.',assess:'Establish symptoms, measurement setting, repeat readings, technique, prescription, adverse effects and target. Office criteria are not automatically home-reading criteria.',\n  care:[['Target < 140/90 without comorbidities.','WHO strong · Rec 6, p16'],['Target SBP < 130 with CVD (strong) or with diabetes, CKD, high risk (conditional).','WHO · Rec 6, p16'],['Monthly follow-up after a change until target; every 3–6 months when controlled.','WHO conditional · Rec 7, p17']],\n  roles:[['Registered nurse','Assess the patient and measurement quality.'],['Doctor','Decide whether treatment or target changes.'],['Pharmacist','Check medicine use and access.'],['Coordinator','Arrange the measurement or review and obtain the outcome.']],\n  evidence:'Clinician reviewed interpretable readings, recorded a decision and set the next BP assessment. A reading received or an appointment booked alone does not complete this.',follow:'Monthly to target · 3–6 mo controlled',signals:['BP_ABOVE_TARGET','DETERIORATION']},\n {id:'WHO-9',set:'WHO',n:9,stage:5,title:'Medicine supply or use interrupted',trigger:'A possible interruption in prescribed medicine supply or use is reported.',assess:'Confirm the current prescription, medicine actually available, last use, symptoms and any instruction to stop. An absent dispensing record alone does not demonstrate missed doses.',\n  care:[['Reason not yet known: keep confirmation open; do not label non-adherence.','Care response'],['Prescriber stopped or changed it: do not restart the old medicine through a refill reminder.','Care response'],['Supply obtained elsewhere: missing local dispensing ≠ a true supply gap.','Care response']],\n  roles:[['Registered nurse','Clarify the reason and the consequence of interruption.'],['Pharmacist','Reconcile supply and use with the prescription.'],['Doctor','Resolve unsafe interruption or treatment change.'],['Coordinator','Resolve access, dispensing or appointment barriers.']],\n  evidence:'Reason resolved or agreed alternative documented; plan, access, understanding and follow-up confirmed. A delivery order alone is insufficient.',follow:'Reassess regimen every 3–6 months',signals:['REFILL_GAP','STATIN_GAP']},\n {id:'WHO-10',set:'WHO',n:10,stage:6,title:'Kidney screening and clinical review',trigger:'Kidney screening is due, or an abnormal result requires clinical review.',assess:'Establish symptoms, urine output, previous results and dates, medicines and acute illness. One abnormal value does not by itself establish CKD.',\n  care:[['Screen yearly with ACR and/or eGFR (preferably both).','HEARTS-D Table 6, p22'],['eGFR < 60 twice, 1–3 months apart, and/or albuminuria twice → diabetic kidney disease.','HEARTS-D Section 3, p21'],['eGFR 30–59 or albuminuria: non-emergency referral. eGFR < 30: same day.','HEARTS-D Section 4, p26']],\n  roles:[['Registered nurse','Obtain dated results and medicine history.'],['Doctor','Interpret pattern; decide confirmation and referral.'],['Coordinator','Arrange tests or referral and obtain the report.']],\n  evidence:'Assessment or specialist care occurred, result reviewed by the clinician, treatment or follow-up documented. An accepted referral alone does not establish completed care.',follow:'Yearly screen',signals:['EGFR_LOW','KIDNEY_DUE']},\n {id:'WHO-11',set:'WHO',n:11,stage:6,title:'Foot assessment and referral',trigger:'A foot examination is due, or an active foot problem is reported.',assess:'Confirm symptoms and an actual examination: skin, sensation, perfusion, deformity, footwear. Unknown findings remain unknown.',\n  care:[['Examine feet for ulcers at every visit; refer if ulcer present.','HEARTS-D Fig. 2, p25'],['Assess amputation risk annually (pulses, monofilament, ulcers, calluses).','HEARTS-D Fig. 2, p25']],\n  roles:[['Registered nurse','Arrange or perform assessment within competence.'],['Doctor','Determine risk and specialist need.'],['Coordinator','Arrange foot-care service and obtain outcome.']],\n  evidence:'Assessment occurred, reviewed by the clinician, follow-up documented.',follow:'Annual',signals:['FOOT_UNKNOWN']},\n {id:'WHO-12',set:'WHO',n:12,stage:6,title:'Eye screening and referral',trigger:'Retinal screening is due, or a visual symptom or retinal abnormality is reported.',assess:'Confirm visual symptoms, last actual eye assessment and report. A missing report is not a normal examination.',\n  care:[['Dilated retinal exam at diagnosis and every two years.','HEARTS-D Fig. 2, p25'],['No retinal exam in two years, or vision loss: refer to ophthalmology.','HEARTS-D Section 3, p21']],\n  roles:[['Registered nurse','Obtain the previous exam and plan.'],['Doctor','Distinguish screening from a new concern.'],['Eye-care clinician','Perform the assessment.'],['Coordinator','Obtain the report and outcome.']],\n  evidence:'Assessment occurred, reviewed by the clinician, follow-up documented.',follow:'Every 2 years',signals:['EYE_UNKNOWN']},\n\n {id:'DOH-1',set:'DOH',n:1,stage:0,title:'Diabetes diagnosis and initial assessment',trigger:'A new diagnosis is reported, or an established care plan cannot yet be confirmed.',assess:'Check diagnosis, classification, clinician, medicines and care arranged.',\n  care:[['FPG ≥ 126 mg/dL, 2-h PG ≥ 200 mg/dL, HbA1c ≥ 6.5%, or random PG ≥ 200 with symptoms.','DoH 3.3, p6'],['Baseline: UACR, creatinine/eGFR, B12 if on metformin, CBC, lipids.','DoH Appendix 1 Table 5, pp38–39']],\n  roles:[['Registered nurse','Assess symptoms and current care.'],['Doctor','Confirm diagnosis and goals.'],['Coordinator','Arrange assessments and first follow-up.']],\n  evidence:'Diagnostic decision, named clinician, goals, required assessments and first follow-up documented.',follow:'Initial',signals:['NEW_DX']},\n {id:'DOH-2',set:'DOH',n:2,stage:1,urgent:true,title:'Hypoglycaemia: treatment and recurrence prevention',trigger:'Low glucose or symptoms suggesting hypoglycaemia.',assess:'Establish glucose, symptoms, consciousness and medicines.',\n  care:[['Glucose < 70 mg/dL (3.9 mmol/L): 15–20 g glucose; recheck in 15 min.','ADA 2024 cited by DoH, pS120'],['Level 2–3 episodes prompt treatment re-evaluation; glucagon for people on insulin.','ADA 2024 cited by DoH']],\n  roles:[['Registered nurse','Live assessment and response.'],['Doctor','Severity and treatment review.'],['Pharmacist','Rescue-treatment access.']],\n  evidence:'Response documented, recurrence prevention and follow-up arranged.',follow:'Same session',signals:['HYPO']},\n {id:'DOH-3',set:'DOH',n:3,stage:0,title:'Confirm blood pressure and measurement setting',trigger:'An elevated blood pressure reading in a person with diabetes needs assessment.',assess:'Establish measurement setting, repeat readings, technique and prescription.',\n  care:[['Hypertension: ≥ 130/80 mmHg averaged over ≥ 2 readings on ≥ 2 occasions.','DoH 3.13, p13'],['≥ 180/110 with CVD may be diagnosed at a single visit.','DoH 3.13, p13']],\n  roles:[['Registered nurse','Assess measurement quality.'],['Doctor','Decide diagnosis.'],['Coordinator','Arrange measurement.']],\n  evidence:'Interpretable readings reviewed and a decision recorded.',follow:'Separate-day confirmation',signals:['BP_ABOVE_TARGET']},\n {id:'DOH-4',set:'DOH',n:4,stage:2,title:'Nutrition and self-management support',trigger:'Diabetes or hypertension diagnosed, support needs change, or planned nutrition and self-management care is due.',assess:'Establish prior education, goals, food access, language and learning needs.',\n  care:[['DSMES at diagnosis, when not meeting goals, annually, and when complicating factors develop.','DoH Appendix 3, p42'],['Medical nutrition therapy shown to improve HbA1c by 0.6%.','DoH Appendix 3 Table 7, p44']],\n  roles:[['Dietitian','Nutrition therapy.'],['Registered nurse','Reinforce self-management.'],['Coordinator','Arrange and confirm.']],\n  evidence:'Education delivered, understanding documented, follow-up agreed. Sending material alone does not establish this.',follow:'Annual + when off goal',signals:['HBA1C_ABOVE_GOAL']},\n {id:'DOH-5',set:'DOH',n:5,stage:4,title:'Blood pressure treatment review',trigger:'Confirmed blood pressure requires treatment or review in a person with diabetes.',assess:'Establish symptoms, setting, repeat readings, technique, prescription, adverse effects and target. Office criteria are not automatically home-reading criteria.',\n  care:[['On-treatment target < 130/80 mmHg if safely attainable.','DoH 3.13.4, p13'],['Confirmed ≥ 150/90: prompt two-drug or single-pill combination.','DoH 3.13.9, p13'],['ACEi or ARB first line with CAD or albuminuria; never combine ACEi + ARB.','DoH 3.13.10–12, p13']],\n  roles:[['Registered nurse','Present symptoms and readings together.'],['Doctor','Decide treatment or target change.'],['Pharmacist','Check use and access.'],['Coordinator','Arrange review and obtain outcome.']],\n  evidence:'Clinician reviewed interpretable readings, recorded a decision and set the next BP assessment. A reading or booking alone does not complete this.',follow:'Monthly until target',signals:['BP_ABOVE_TARGET','DETERIORATION']},\n {id:'DOH-6',set:'DOH',n:6,stage:4,title:'Glycaemic goals and treatment review',trigger:'Glycaemia is outside the individual goal, or hypoglycaemia or treatment burden requires review.',assess:'Review results, hypoglycaemic events, actual medicine use, comorbidities, treatment burden, preferences and the previously agreed goal.',\n  care:[['HbA1c goal < 7% (53 mmol/mol) for many non-pregnant adults.','DoH 3.11.5, p11'],['Intensification for people not meeting goals should not be delayed.','DoH 3.9.7, p10'],['Deintensify insulin or sulfonylureas where hypoglycaemia risk is high.','DoH 3.11.9, p11']],\n  roles:[['Registered nurse','Assess monitoring, medicine use and barriers.'],['Doctor','Decide intensification or deintensification.'],['Pharmacist','Support the prescribed change.'],['Coordinator','Arrange review and investigations.']],\n  evidence:'Clinician recorded the individual goal, treatment decision and monitoring plan. Education, access and follow-up confirmed.',follow:'HbA1c every 3 months off goal',signals:['HBA1C_ABOVE_GOAL']},\n {id:'DOH-7',set:'DOH',n:7,stage:5,title:'Medicine supply or use interrupted',trigger:'A possible interruption in prescribed medicine supply or use is reported.',assess:'Confirm current prescription, medicine available, last use and any instruction to stop. An absent dispensing record alone does not demonstrate missed doses.',\n  care:[['Re-evaluate regimen and medication-taking every 3–6 months.','DoH 3.9.8, p10'],['Consider costs and coverage to reduce cost-related barriers.','DoH 3.14.22, p21'],['Five reason branches — each has its own close-out evidence.','Care response']],\n  roles:[['Registered nurse','Clarify reason and consequence.'],['Pharmacist','Reconcile supply and use.'],['Doctor','Resolve unsafe interruption.'],['Coordinator','Resolve access barriers.']],\n  evidence:'Reason resolved or alternative documented; plan, access, understanding and follow-up confirmed. A delivery order alone is insufficient.',follow:'3–6 months',signals:['REFILL_GAP','STATIN_GAP'],\n  branches:[['Reason not yet known','Keep confirmation open. Do not label non-adherence.'],['Prescribed medicine unavailable','Pharmacist verifies; coordinator arranges authorised supply or alternative.'],['Prescriber stopped or changed it','Confirm instruction. Do not restart the old medicine through a refill reminder.'],['Supply obtained elsewhere','Confirm quantity and regimen; reconcile duplicates.'],['Side effects, concerns or other reason','Assess without blame; pharmacist and doctor agree a safe plan.']]},\n {id:'DOH-8',set:'DOH',n:8,stage:6,title:'Glycaemic review and medicine-related monitoring',trigger:'An assessment is becoming due, appears overdue, or an expected reading or result is unavailable.',assess:'Distinguish not yet due, booked, performed with result pending, performed elsewhere, awaiting review, and genuinely missed. Missing information is not a normal result.',\n  care:[['HbA1c or CGM metrics at least twice a year; quarterly when off goal or therapy changed.','DoH 3.11.1, p11'],['On ACEi/ARB/MRA/diuretic: creatinine, eGFR and potassium within 7–14 days of starting, then annually.','DoH 3.13, p13']],\n  roles:[['Registered nurse','Confirm what was performed.'],['Doctor','Set due date; review results.'],['Coordinator','Obtain outside results; confirm the report reached the clinician.']],\n  evidence:'Assessment performed, result available, clinician review documented and next due date agreed.',follow:'2–4× per year',signals:['HBA1C_OVERDUE']},\n {id:'DOH-9',set:'DOH',n:9,stage:6,title:'Vaccination and smoking cessation',trigger:'Preventive care is due or smoking is reported.',assess:'Confirm vaccination history, contraindications and smoking status.',\n  care:[['Provide routinely recommended vaccinations by age.','DoH Table 6'],['Ask about tobacco; refer for combined counselling + pharmacotherapy.','DoH Appendix 3 item 14, p42']],\n  roles:[['Registered nurse','Review preventive needs.'],['Doctor','Confirm indicated care.'],['Coordinator','Arrange and record.']],\n  evidence:'Intervention and outcome documented, next preventive need recorded.',follow:'Per schedule',signals:[]},\n {id:'DOH-10',set:'DOH',n:10,stage:7,title:'An agreed assessment or referral is not completed',trigger:'An agreed assessment, referral or follow-up has not been confirmed as completed.',assess:'Confirm the agreed action, reason, due date and clinician. Establish whether care occurred elsewhere, result pending, plan changed, declined, access failed or no contact.',\n  care:[['Care reported elsewhere: outside report received and clinically reviewed.','Care response'],['Declined: informed decision documented; not labelled delivered care.','Care response'],['Contact not established: failed contact alone cannot establish safety or completion.','Care response']],\n  roles:[['Registered nurse','Confirm the account; assess unsafe delay.'],['Doctor','Decide whether the need remains.'],['Coordinator','Obtain records; renew contact.']],\n  evidence:'Indicated care delivered and reviewed. A clinician-authorised changed plan is recorded separately.',follow:'Per agreed due date',signals:['REPEAT_ER','NOREACH']},\n {id:'DOH-11',set:'DOH',n:11,stage:7,title:'Kidney screening, confirmation and referral',trigger:'Kidney screening is due, or a new or progressive abnormality requires assessment.',assess:'Establish symptoms, urine output, previous results and dates, medicines and acute illness. One abnormal value does not establish CKD.',\n  care:[['UACR and eGFR at least annually in all T2DM.','DoH 3.14, p20'],['Established CKD: monitor 1–4× per year by stage.','DoH Appendix 5'],['Refer to nephrology: rising albuminuria, falling eGFR, or eGFR < 30.','DoH Figure 1, p40']],\n  roles:[['Registered nurse','Obtain dated results and medicine history.'],['Doctor','Decide confirmation and referral.'],['Coordinator','Arrange tests; obtain report.']],\n  evidence:'Assessment or specialist care occurred, result reviewed, treatment or follow-up documented. An accepted referral alone does not establish completed care.',follow:'Annual · 1–4×/yr in CKD',signals:['EGFR_LOW','KIDNEY_DUE']},\n {id:'DOH-12',set:'DOH',n:12,stage:7,title:'Foot assessment and specialist care',trigger:'A foot assessment is due, or symptoms, a wound or a high-risk foot requires review.',assess:'Confirm an actual foot examination. Absence of reported symptoms does not substitute for examination.',\n  care:[['Comprehensive foot evaluation at least annually.','DoH 3.14'],['Sensory loss or prior ulcer: inspect at every visit.','DoH 3.14']],\n  roles:[['Registered nurse','Arrange or perform assessment.'],['Doctor','Determine risk.'],['Coordinator','Arrange foot care; obtain outcome.']],\n  evidence:'Assessment occurred, reviewed, follow-up documented.',follow:'Annual',signals:['FOOT_UNKNOWN']},\n {id:'DOH-13',set:'DOH',n:13,stage:7,title:'Retinal screening and specialist care',trigger:'An eye examination is due, or a retinal abnormality requires specialist care.',assess:'Confirm last actual eye assessment and report. A missing report is not a normal examination.',\n  care:[['Dilated eye exam at diagnosis; every 1–2 years if no retinopathy and on goal.','DoH 3.14'],['Any retinopathy: at least annually by ophthalmology or optometry.','DoH 3.14']],\n  roles:[['Registered nurse','Obtain previous exam and plan.'],['Doctor','Determine response.'],['Eye-care clinician','Perform assessment.'],['Coordinator','Obtain report.']],\n  evidence:'Assessment occurred, reviewed, follow-up documented.',follow:'1–2 years',signals:['EYE_UNKNOWN']},\n {id:'DOH-14',set:'DOH',n:14,stage:8,title:'Discharge into continuing care',trigger:'Discharge is planned or has occurred and the continuing-care plan needs confirmation.',assess:'Confirm discharge occurred, where the person is, symptoms, discharge summary, medicine changes, pending results, supplies, understanding and named follow-up clinicians.',\n  care:[['Cross-check home and hospital medicines so no chronic medicine is stopped.','DoH 3.15.16, p31'],['Book follow-up before discharge with an agreed time and place.','DoH 3.15.20, p31'],['Review sick-day rules, hypo/hyperglycaemia and when to call.','DoH 3.15.22–26, pp31–32']],\n  roles:[['Registered nurse','Confirm discharge and understanding.'],['Doctor','Review medicine changes.'],['Coordinator','Arrange follow-up; confirm records delivered.']],\n  evidence:'Person understands the plan; pending results and follow-up have named clinicians and dates. Outstanding needs remain visible.',follow:'≤ 7 days post-discharge',signals:['REPEAT_ER']}\n];\n\n/* Signal rules (MEMBER_SIGNAL.signal_code) — each reads named data points and maps to pathways. */\nwindow.SIGNALS={\n REPEAT_ER:{label:'Repeat ER, no follow-up',sev:'high',rule:\"COUNT(FACT_ENCOUNTER where encounter_type='ER', admit_ts > now-90d) >= 2 AND no OP GP claim since last discharge\",reads:['FACT_ENCOUNTER.encounter_type','FACT_ENCOUNTER.discharge_ts','FACT_CLAIM.claim_type','FACT_CLAIM_LINE.specialty'],paths:['DOH-14','DOH-10']},\n REFILL_GAP:{label:'Possible medicine supply gap',sev:'high',rule:'MEMBER_ADHERENCE.pdc < 80 OR gap_over_30d = true (window 180 d)',reads:['MEMBER_ADHERENCE.pdc','MEMBER_ADHERENCE.supply_run_out_date','FACT_RX_FILL.days_supply'],paths:['DOH-7','WHO-9']},\n STATIN_GAP:{label:'Statin gap with high LDL',sev:'mod',rule:\"MEMBER_ADHERENCE.drug_class='Statin' AND pdc < 80 AND last FACT_OBSERVATION LDL > 2.6\",reads:['MEMBER_ADHERENCE.pdc','FACT_OBSERVATION.value'],paths:['DOH-7']},\n HBA1C_ABOVE_GOAL:{label:'HbA1c above individual goal',sev:'high',rule:\"last FACT_OBSERVATION obs_code='HbA1c' >= 7.0 (default goal; individual goal overrides)\",reads:['FACT_OBSERVATION.obs_code','FACT_OBSERVATION.value','FACT_OBSERVATION.observed_at'],paths:['DOH-6','DOH-4']},\n HBA1C_OVERDUE:{label:'HbA1c review overdue',sev:'mod',rule:\"MEMBER_CONDITION T2D AND no HbA1c in 180 d (90 d if last above goal)\",reads:['MEMBER_CONDITION.condition_code','FACT_OBSERVATION.observed_at'],paths:['DOH-8']},\n BP_ABOVE_TARGET:{label:'BP above target',sev:'high',rule:'last BP >= 130/80 with diabetes or CKD; >= 140/90 otherwise',reads:['FACT_OBSERVATION.obs_code','FACT_OBSERVATION.value','FACT_OBSERVATION.device_type'],paths:['DOH-5','WHO-8']},\n BP_URGENT:{label:'BP in same-day range',sev:'crit',rule:'SBP > 180 or DBP > 110 → ask about symptoms; > 200/110 → same-day referral',reads:['FACT_OBSERVATION.value'],paths:['WHO-5']},\n EGFR_LOW:{label:'eGFR below 60',sev:'high',rule:\"last eGFR < 60 (confirm with repeat 1–3 months apart)\",reads:['FACT_OBSERVATION.value','SRC_LAB_RESULT.test_code'],paths:['DOH-11','WHO-10']},\n EGFR_CRITICAL:{label:'eGFR below 30',sev:'crit',rule:'last eGFR < 30 → same-day referral',reads:['FACT_OBSERVATION.value'],paths:['WHO-5']},\n KIDNEY_DUE:{label:'Kidney screen due',sev:'mod',rule:'T2D AND no eGFR or UACR in 12 months',reads:['MEMBER_CONDITION.condition_code','FACT_OBSERVATION.observed_at'],paths:['DOH-11']},\n DETERIORATION:{label:'Wearable deterioration',sev:'high',rule:'MEMBER_SCORE.band in (Elevated, High) AND deterioration_delta > 0',reads:['MEMBER_SCORE.score','MEMBER_SCORE.drivers_json','FACT_OBSERVATION.device_type'],paths:['DOH-5','WHO-8']},\n HYPO:{label:'Low glucose on CGM',sev:'crit',rule:'CGM glucose < 3.9 mmol/L in last 7 days',reads:['FACT_OBSERVATION.value','FACT_OBSERVATION.device_type'],paths:['DOH-2','WHO-3']},\n EYE_UNKNOWN:{label:'Eye exam not on record',sev:'low',rule:'T2D AND no retinal exam claim in 24 months → unknown, not normal',reads:['FACT_CLAIM_LINE.code','MEMBER_CONDITION.condition_code'],paths:['DOH-13','WHO-12']},\n FOOT_UNKNOWN:{label:'Foot exam not on record',sev:'low',rule:'T2D AND no foot exam in 12 months → unknown, not normal',reads:['FACT_CLAIM_LINE.code'],paths:['DOH-12','WHO-11']},\n NOREACH:{label:'Not reached on last attempt',sev:'mod',rule:\"last DISPOSITION_EVENT.reached = false\",reads:['DISPOSITION_EVENT.reached'],paths:['DOH-10']},\n NEW_DX:{label:'New diagnosis',sev:'mod',rule:'MEMBER_CONDITION.first_dx_date within 30 d',reads:['MEMBER_CONDITION.first_dx_date'],paths:['DOH-1','WHO-1','WHO-2']}\n};\n/* NBA library seed — what a nurse can offer. Each entry: trigger signals, pathway, role, guardrails,\n   script blocks, action code (DISPOSITION_CODE_SET), completion evidence and the claim/event that proves it. */\nwindow.NBA_SEED=[\n {id:'NBA-ER-01',label:'Book GP follow-up within 72 h',signals:['REPEAT_ER'],path:'DOH-14',role:'Coordinator',channel:'Call',code:'ACT_GP_FU_72H',needsCare:false,priority:90,follow:'72 h',status:'Approved',ver:3,\n  guard:'If chest pain, breathlessness or confusion now → stop and escalate to the doctor.',\n  script:[['WHY','I can see you’ve needed the emergency department {er} recently. I want to make sure your own doctor follows that up.'],['ASK','Can I book you a GP follow-up in the next three days? {best_time} works for you, is that right?'],['CHECK','Do you have the discharge letter or any new medicines from the hospital?']],\n  evidence:'GP outpatient claim within 7 days of agreement',proof:\"FACT_CLAIM claim_type='OP' + FACT_CLAIM_LINE specialty='General Practice' after DISPOSITION_EVENT.event_ts\"},\n {id:'NBA-ER-02',label:'Share 24/7 nurse line and urgent-care options',signals:['REPEAT_ER'],path:'DOH-14',role:'Registered nurse',channel:'Call + SMS',code:'ACT_NURSE_LINE',needsCare:false,priority:60,follow:'—',status:'Approved',ver:2,\n  script:[['OFFER','Next time you feel unwell out of hours, you can call our nurse line any time, day or night. I’ll text you the number and the nearest urgent-care clinic.']],\n  evidence:'Education is documented, not counted as completed care',proof:'NOTE_EVENT note_type=education; no claim evidence'},\n {id:'NBA-MED-01',label:'Clarify the reason for the medicine gap',signals:['REFILL_GAP'],path:'DOH-7',role:'Registered nurse',channel:'Call',code:'ACT_MED_REASON',needsCare:false,priority:85,follow:'Same call',status:'Approved',ver:4,\n  guard:'Do not label non-adherence. An absent dispensing record alone does not prove missed doses.',\n  script:[['WHY','Our records show your {drug} may have run low, but that isn’t always the full picture.'],['ASK','How are you getting on with your {drug} at the moment? Do you have some at home?'],['CHECK','Has a doctor stopped or changed it, or do you get it from another pharmacy?']],\n  evidence:'Reason confirmed and branch selected',proof:'DISPOSITION_EVENT.barrier_codes + NOTE_EVENT'},\n {id:'NBA-MED-02',label:'Arrange a pharmacist reconciliation call',signals:['REFILL_GAP','STATIN_GAP'],path:'DOH-7',role:'Pharmacist',channel:'Call',code:'ACT_PHARM_CALL',needsCare:false,priority:70,follow:'48 h',status:'Approved',ver:2,\n  script:[['OFFER','I’d like our pharmacist to call you to check your medicines line up with your prescription. Is tomorrow OK?']],\n  evidence:'Pharmacist note plus next fill within 14 days',proof:'FACT_RX_FILL fill_date within 14 d for the drug_class'},\n {id:'NBA-MED-03',label:'Set up refill reminders',signals:['REFILL_GAP'],path:'DOH-7',role:'Coordinator',channel:'SMS',code:'ACT_REFILL_REMIND',needsCare:false,priority:55,follow:'Next run-out date',status:'Approved',ver:3,\n  guard:'Only when the reason is forgetting. Never when the prescriber stopped or changed the medicine.',\n  script:[['OFFER','Would a text reminder a few days before your {drug} runs out help?']],\n  evidence:'Next fill on time',proof:'FACT_RX_FILL.fill_date ≤ MEMBER_ADHERENCE.supply_run_out_date'},\n {id:'NBA-MED-04',label:'Arrange home delivery',signals:['REFILL_GAP'],path:'DOH-7',role:'Coordinator',channel:'Call',code:'ACT_HOME_DELIVERY',needsCare:false,priority:50,follow:'5 days',status:'Approved',ver:1,\n  script:[['OFFER','If getting to the pharmacy is hard, we can arrange delivery to your home.']],\n  evidence:'Medicine received, not just ordered',proof:'FACT_RX_FILL with delivery flag; a delivery order alone is insufficient'},\n {id:'NBA-GLY-01',label:'Book a glycaemic treatment review',signals:['HBA1C_ABOVE_GOAL'],path:'DOH-6',role:'Doctor',channel:'Call',code:'ACT_GLY_REVIEW',needsCare:true,priority:80,follow:'14 days',status:'Approved',ver:2,\n  script:[['WHY','Your last HbA1c was {hba1c}, a bit above the 7% goal we aim for.'],['ASK','Could we book you with your doctor to review your diabetes plan in the next two weeks?']],\n  evidence:'Clinician recorded goal, decision and monitoring plan',proof:'Endocrine/GP consult claim + new HbA1c FACT_OBSERVATION within 90 d'},\n {id:'NBA-GLY-02',label:'Book an HbA1c test at an in-network lab',signals:['HBA1C_OVERDUE'],path:'DOH-8',role:'Coordinator',channel:'SMS',code:'ACT_LAB_HBA1C',needsCare:false,priority:65,follow:'14 days',status:'Approved',ver:2,\n  script:[['WHY','Your diabetes blood test is due.'],['OFFER','I can send a lab referral to your phone for the nearest in-network lab.']],\n  evidence:'Result available and reviewed', _SIGNAL<\u002Fspan><\u002Fdiv><div class=\"card-b\">${bars(Object.entries(trig).sort((a,b)=>b[1]-a[1]),Math.max(...Object.values(trig)),'var(--info)')}<\u002Fdiv><\u002Fsection><\u002Fdiv>\n\n  <section class=\"card\"><div class=\"card-h\"><h3>Consent and profile completeness by segment<\u002Fh3><\u002Fdiv><div class=\"card-b tblwrap\"><table class=\"tbl\"><thead><tr><th>Segment<\u002Fth><th>Members<\u002Fth><th>Consent granted<\u002Fth><th>Avg profile complete<\u002Fth><th>Nurse effort<\u002Fth><\u002Ftr><\u002Fthead><tbody>${segs.map(s=>`<tr><td><span class=\"pill segpill ${s[0]}\">${esc(SEGS[s[0]].label)}<\u002Fspan><\u002Ftd><td class=\"num\">${s[1]}<\u002Ftd><td><div class=\"frow\" style=\"grid-template-columns:1fr 42px;padding:0\"><span class=\"hbar\"><i style=\"width:${s[2]}%;background:var(--seg-${s[0].toLowerCase()})\"><\u002Fi><\u002Fspan><span class=\"v\">${s[2]}%<\u002Fspan><\u002Fdiv><\u002Ftd><td><div class=\"frow\" style=\"grid-template-columns:1fr 42px;padding:0\"><span class=\"hbar\"><i style=\"width:${s[3]}%;background:var(--seg-${s[0].toLowerCase()})\"><\u002Fi><\u002Fspan><span class=\"v\">${s[3]}%<\u002Fspan><\u002Fdiv><\u002Ftd><td>${SEGS[s[0]].effort}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fsection><\u002Fdiv><\u002Fdiv>`;\n};\n\n/* ---------- v9: timeline, journal, decision tree ---------- */\nS.jr=S.jr||{};S.tree=S.tree||{mem:''};S.libView=S.libView||'tree';S.otherOpen=false;S.tlF='all';\nconst rdays=s=>{s=String(s||'');if(/just now|today/i.test(s))return 0;const n=parseFloat(s.replace(/[^\\d.]/g,''))||1;return /mo/.test(s)?n*30:/wk|week/.test(s)?n*7:/yr|year/.test(s)?n*365:/day|\\bd\\b/.test(s)?n:/\\bh\\b|hour/.test(s)?n/24:n;};\nconst jr=(id,title,detail)=>{if(!id)return;(S.jr[id]=S.jr[id]||[]).unshift({t:nowT().slice(0,5),title,detail:detail||''});};\nfunction coordTimeline(m){\n  const E=[],o=ocSt(m.id),add=(d,kind,title,detail,tag,x)=>E.push(Object.assign({d,kind,title,detail,tag},x||{}));\n  const sg= one'&&!X.st[x.need]){X.st[x.need]=x.res==='declined'?'declined':'done';x.res=x.res||'done';X.log.unshift({t:nowT(),what:x.title,o:X.st[x.need],next:'From Actions'});linkPlan(byId(x.mid));}\n  else if(x.st==='open'&&x.res&&X.st[x.need]){delete X.st[x.need];delete x.res;}});}\n(()=>{const _d=draw;draw=function(){syncPlan();_d();};})();\n(()=>{const _s=A.save;A.save=(...a)=>{_s(...a);const m=byId(S.sel);linkPlan(m);};})();\n(()=>{const _g=A.grant;A.grant=(...a)=>{_g(...a);linkPlan(byId(S.sel));};})();\nlinkAll();\n\n/* ---- 2. Bridge to Chronic Care Studio (when embedded as screen 3): call list + focus in, outcomes out ---- */\nconst BR={embedded:window.parent!==window,queued:[],campaign:''};\nconst byMask=k=>D.find(x=>x.mask===k);\n(()=>{const _q=queueMembers;queueMembers=function(){const l=_q();if(!BR.queued.length)return l;\n  const isQ=m=>BR.queued.includes(m.mask);return l.filter(isQ).concat(l.filter(m=>!isQ(m)));};})();\nwindow.addEventListener('message',e=>{if(!BR.embedded||e.source!==window.parent)return;const d=e.data||{};if(d.type!=='ccl:sync')return;\n  BR.queued=(d.queued||[]).filter(byMask);BR.campaign=d.campaign||'';\n  BR.queued.forEach(k=>{const m=byMask(k);if(m&&!['new','agreed','scheduled','noreach'].includes(m._status)&&!S.done.includes(m.id))m._status='new';});\n  if(d.focus){const m=byMask(d.focus);if(m){S.page='queue';S.qMin=false;onSelect(m.id);}}\n  render();});\n(()=>{const _d=draw;draw=function(){_d();if(!BR.queued.length)return;\n  document.querySelectorAll('.qi[data-arg]').forEach(el=>{const m=byId(el.dataset.arg);if(m&&BR.queued.includes(m.mask)&&!el.querySelector('.fromst')){const b=document.createElement('span');b.className='fromst';b.textContent='From care intelligence'+(BR.campaign?' · '+BR.campaign:'');el.prepend(b);}});};})();\n(()=>{const _s=A.save;A.save=(...a)=>{const m=byId(S.sel),was=ocSt(m.id).saved;_s(...a);const o=ocSt(m.id);\n  if(BR.embedded&&!was&&o.saved)window.parent.postMessage({type:'ccl:writeback',id:m.mask,name:m.name,response:o.response||o.reached,actions:o.acts.length,tasks:tasks().filter(x=>x.mid===m.id&&x.st==='open').length},'*');};})();\nif(BR.embedded)window.parent.postMessage({type:'ccl:ready'},'*');\nwindow.__portal={S,D,A,byId,needsOf,planTask,cpx,LOCKED,tasks,render}; /* test hook */\n\n(()=>{const st=document.createElement('style');st.textContent=`\n.nd-l{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;padding-top:6px;border-top:1px dashed rgba(120,130,160,.25)}.nd-l .btn{padding:2px 8px}\n.cpl{border:0;border-radius:10px;padding:1px 8px;margin:3px 0;font:600 10.5px 'IBM Plex Sans',sans-serif;background:rgba(52,69,196,.1);color:#3445C4;cursor:pointer;align-self:flex-start}\n.rail a.nav{text-decoration:none;color:inherit}\n.fromst{display:block;font:600 10.5px 'IBM Plex Mono',monospace;color:#3F6C9F;margin-bottom:4px}\n`;document.head.appendChild(st);})();\n\nonSelect(S.sel);\nrender();\n\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
