  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed

    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bers needing urgent or priority care<\u002Fdiv>\n      <div style=\"display:flex;gap:18px;margin-top:8px;font-size:13px;color:#4F5E6B\">\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#C8352E\"><\u002Fspan>Urgent · {{ c2v.a }}<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#B7791F\"><\u002Fspan>Priority · {{ c2v.b }}<\u002Fspan>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 380 170\" style=\"width:100%;height:auto;display:block;margin-top:10px;font-family:'Hanken Grotesk',sans-serif\">\n        <path d=\"{{ c2.grid }}\" stroke=\"#ECE8E0\" fill=\"none\"><\u002Fpath>\n        <text x=\"28\" y=\"{{ c2.t0.y }}\" text-anchor=\"end\" font-size=\"11\" fill=\"#6E7A84\">{{ c2.t0.l }}<\u002Ftext>\n        <text x=\"28\" y=\"{{ c2.t2.y }}\" text-anchor=\"end\" font-size=\"11\" fill=\"#6E7A84\">{{ c2.t2.l }}<\u002Ftext>\n        <text x=\"28\" y=\"{{ c2.t4.y }}\" text-anchor=\"end\" font-size=\"11\" fill=\"#6E7A84\">{{ c2.t4.l }}<\u002Ftext>\n        <text x=\"34\" y=\"164\" font-size=\"11\" fill=\"#6E7A84\">{{ xl.a }}<\u002Ftext>\n        <text x=\"200\" y=\"164\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6E7A84\">{{ xl.c }}<\u002Ftext>\n        <text x=\"366\" y=\"164\" text-anchor=\"end\" font-size=\"11\" fill=\"#6E7A84\">{{ xl.e }}<\u002Ftext>\n        <path d=\"{{ c2.d1 }}\" fill=\"none\" stroke=\"#B7791F\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpath>\n        <path d=\"{{ c2.d0 }}\" fill=\"none\" stroke=\"#C8352E\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpath>\n        <circle cx=\"{{ c2.e1.x }}\" cy=\"{{ c2.e1.y }}\" r=\"4\" fill=\"#B7791F\"><\u002Fcircle>\n        <circle cx=\"{{ c2.e0.x }}\" cy=\"{{ c2.e0.y }}\" r=\"4\" fill=\"#C8352E\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border-radius:28px;padding:24px 24px 16px;min-width:0\">\n      <div style=\"font-size:15px;font-weight:700\">Care gaps: open vs closed in claims<\u002Fdiv>\n      <div style=\"display:flex;gap:18px;margin-top:8px;font-size:13px;color:#4F5E6B\">\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#B7791F\"><\u002Fspan>Open · {{ c3v.a }}<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#0F766E\"><\u002Fspan>Closed · {{ c3v.b }}<\u002Fspan>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 380 170\" style=\"width:100%;height:auto;display:block;margin-top:10px;font-family:'Hanken Grotesk',sans-serif\">\n        <path d=\"{{ c3.grid }}\" stroke=\"#ECE8E0\" fill=\"none\"><\u002Fpath>\n        <text x=\"28\" y=\"{{ c3.t0.y }}\" text-anchor=\"end\" font-size=\"11\" fill=\"#6E7A84\">{{ c3.t0.l }}<\u002Ftext>\n        <text x=\"28\" y=\"{{ c3.t2.y }}\" text-anchor=\"end\" font-size=\"11\" fill=\"#6E7A84\">{{ c3.t2.l }}<\u002Ftext>\n        <text x=\"28\" y=\"{{ c3.t4.y }}\" text-anchor=\"end\" font-size=\"11\" fill=\"#6E7A84\">{{ c3.t4.l }}<\u002Ftext>\n        <text x=\"34\" y=\"164\" font-size=\"11\" fill=\"#6E7A84\">{{ xl.a }}<\u002Ftext>\n        <text x=\"200\" y=\"164\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6E7A84\">{{ xl.c }}<\u002Ftext>\n        <text x=\"366\" y=\"164\" text-anchor=\"end\" font-size=\"11\" fill=\"#6E7A84\">{{ xl.e }}<\u002Ftext>\n        <path d=\"{{ c3.d0 }}\" fill=\"none\" stroke=\"#B7791F\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpath>\n        <path d=\"{{ c3.d1 }}\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath>\n        <circle cx=\"{{ c3.e0.x }}\" cy=\"{{ c3.e0.y }}\" r=\"4\" fill=\"#B7791F\"><\u002Fcircle>\n        <circle cx=\"{{ c3.e1.x }}\" cy=\"{{ c3.e1.y }}\" r=\"4\" fill=\"#0F766E\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border-radius:28px;padding:24px;min-width:0;display:flex;flex-direction:column\">\n      <div style=\"font-size:15px;font-weight:700\">Risk mix of the whole cohort<\u002Fdiv>\n      <div style=\"font-size:13px;color:#4F5E6B;margin-top:8px\">Share of members at each risk level<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:22px;flex:1\">\n        <div>\n          <div style=\"font-size:12.5px;font-weight:600;color:#6E7A84;margin-bottom:6px\">Day 0<\u002Fdiv>\n          <div style=\"display:flex;height:28px;border-radius:8px;overflow:hidden;gap:2px\">\n            <sc-for list=\"{{ mix0 }}\" as=\"g\" hint-placeholder-count=\"4\"><div style=\"flex:{{ g.f }};background:{{ g.bg }};transition:flex .45s ease\"><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12.5px;font-weight:600;color:#6E7A84;margin-bottom:6px\">Day {{ day }}<\u002Fdiv>\n          <div style=\"display:flex;height:28px;border-radius:8px;overflow:hidden;gap:2px\">\n            <sc-for list=\"{{ mix }}\" as=\"g\" hint-placeholder-count=\"4\"><div style=\"flex:{{ g.f }};background:{{ g.bg }};transition:flex .45s ease\"><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:18px;font-size:12.5px;color:#4F5E6B\">\n        <sc-for list=\"{{ mix }}\" as=\"g\" hint-placeholder-count=\"4\"><span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:{{ g.bg }}\"><\u002Fspan>{{ g.name }} · {{ g.n0 }} → {{ g.n }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"02 Loop\" style=\"background:#FFFFFF;margin-top:48px\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:88px 32px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px 64px;align-items:end;margin-bottom:36px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#0F766E\">02 · How it works<\u002Fdiv>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,4.2vw,56px);line-height:1.04;margin:14px 0 0;letter-spacing:-.01em;text-wrap:balance\">Four steps. The last one teaches the second.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:17px;line-height:1.55;color:#4F5E6B;margin:0;max-width:56ch;text-wrap:pretty\">Select a step to see what it does and what it produced in the simulation so far. The numbers move as the year plays.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px\">\n      <button sc-camel-on-click=\"{{ pick0 }}\" style=\"text-align:left;border:1px solid #E2DED5;border-radius:20px;padding:20px 22px;cursor:pointer;background:{{ st0.bg }};color:{{ st0.fg }};transition:background .2s\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:{{ st0.num }}\">01<\u002Fdiv>\n        <div style=\"font-family:'Instrument Serif',serif;font-size:32px;line-height:1.1;margin-top:6px\">Find<\u002Fdiv>\n        <div style=\"font-size:13px;color:{{ st0.sub }};margin-top:2px\">Cohort builder<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;margin-top:14px\">{{ r0 }}<\u002Fdiv>\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pick1 }}\" style=\"text-align:left;border:1px solid #E2DED5;border-radius:20px;padding:20px 22px;cursor:pointer;background:{{ st1.bg }};color:{{ st1.fg }};transition:background .2s\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:{{ st1.num }}\">02<\u002Fdiv>\n        <div style=\"font-family:'Instrument Serif',serif;font-size:32px;line-height:1.1;margin-top:6px\">Prioritise<\u002Fdiv>\n        <div style=\"font-size:13px;color:{{ st1.sub }};margin-top:2px\">Care intelligence<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;margin-top:14px\">{{ r1 }}<\u002Fdiv>\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pick2 }}\" style=\"text-align:left;border:1px solid #E2DED5;border-radius:20px;padding:20px 22px;cursor:pointer;background:{{ st2.bg }};color:{{ st2.fg }};transition:background .2s\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:{{ st2.num }}\">03<\u002Fdiv>\n        <div style=\"font-family:'Instrument Serif',serif;font-size:32px;line-height:1.1;margin-top:6px\">Engage<\u002Fdiv>\n        <div style=\"font-size:13px;color:{{ st2.sub }};margin-top:2px\">Care portal<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;margin-top:14px\">{{ r2 }}<\u002Fdiv>\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pick3 }}\" style=\"text-align:left;border:1px solid #E2DED5;border-radius:20px;padding:20px 22px;cursor:pointer;background:{{ st3.bg }};color:{{ st3.fg }};transition:background .2s\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:{{ st3.num }}\">04 · LOOPS BACK<\u002Fdiv>\n        <div style=\"font-family:'Instrument Serif',serif;font-size:32px;line-height:1.1;margin-top:6px\">Learn<\u002Fdiv>\n        <div style=\"font-size:13px;color:{{ st3.sub }};margin-top:2px\">Write-back<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;margin-top:14px\">{{ r3 }}<\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:16px;background:#F4F2ED;border-radius:28px;padding:clamp(24px,3.5vw,44px)\">\n      <sc-if value=\"{{ is.s0 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:36px 56px\">\n          <div>\n            <h3 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1;margin:0;text-wrap:balance\">We start with every member who has diabetes or high blood pressure.<\u002Fh3>\n            <p style=\"font-size:16px;line-height:1.6;color:#4F5E6B;margin:16px 0 0;text-wrap:pretty\">They are found in Daman claims history. The list refreshes every night, so new diagnoses join automatically and people who leave the plan drop out.<\u002Fp>\n            <div style=\"display:grid;gap:12px;margin-top:24px\">\n              <div style=\"background:#FFFFFF;border-radius:18px;padding:18px 20px\"><div style=\"font-weight:700;font-size:15px\">Why a control group?<\u002Fdiv><p style=\"margin:6px 0 0;font-size:14.5px;line-height:1.55;color:#4F5E6B\">About {{ s0.holdPct }}% of members get usual care. Comparing them with the members we call is how the programme proves impact, not just activity.<\u002Fp><\u002Fdiv>\n              <div style=\"background:#FFFFFF;border-radius:18px;padding:18px 20px\"><div style=\"font-weight:700;font-size:15px\">Left out, on purpose<\u002Fdiv><p style=\"margin:6px 0 0;font-size:14.5px;line-height:1.55;color:#4F5E6B\">Members who opted out of contact and those in active cancer care. Other teams look after them.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start\">\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:52px;line-height:1\">{{ s0.treated }}<\u002Fdiv><div style=\"font-size:14px;color:#4F5E6B;margin-top:6px\">members in the programme<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:52px;line-height:1\">{{ s0.both }}<\u002Fdiv><div style=\"font-size:14px;color:#4F5E6B;margin-top:6px\">have both conditions<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:52px;line-height:1\">{{ s0.split }}<\u002Fdiv><div style=\"font-size:14px;color:#4F5E6B;margin-top:6px\">diabetes only · blood pressure only<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:22px\"><div style=\"font-family:'Instrument Serif',serif;font-size:52px;line-height:1;color:#5B6670\">{{ s0.holdout }}<\u002Fdiv><div style=\"font-size:14px;color:#4F5E6B;margin-top:6px\">control group, not called<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ is.s1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:20px 56px;align-items:end\">\n            <h3 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1;margin:0;text-wrap:balance\">Every night, each member is checked against DoH Abu Dhabi guidelines.<\u002Fh3>\n            <p style=\"font-size:16px;line-height:1.6;color:#4F5E6B;margin:0;text-wrap:pretty\">The engine gives each member a risk level, lists what needs attention, and picks the single most useful next step for the nurse. Every rule is clinician-approved and linked to its guideline.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:28px\">\n            <sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"background:{{ t.bg }};color:{{ t.fg }};border-radius:18px;padding:20px 22px\">\n                <div style=\"font-family:'Instrument Serif',serif;font-size:48px;line-height:1\">{{ t.n }}<\u002Fdiv>\n                <div style=\"font-weight:700;font-size:15px;margin-top:6px\">{{ t.name }}<\u002Fdiv>\n                <div style=\"font-size:13px;margin-top:4px;line-height:1.4\">{{ t.cad }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;margin-top:12px\">\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:22px 24px\">\n              <div style=\"font-weight:700;font-size:15px;margin-bottom:14px\">Most common reasons members are flagged<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ top }}\" as=\"r\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:14px\">\n                    <span>{{ r.label }}<\u002Fspan>\n                    <div style=\"height:10px;background:#EEEBE4;border-radius:6px;overflow:hidden\"><div style=\"height:100%;width:{{ r.w }};background:#0F766E;border-radius:6px;transition:width .45s ease\"><\u002Fdiv><\u002Fdiv>\n                    <b style=\"text-align:right\">{{ r.n }}<\u002Fb>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:16px\">\n              <div style=\"font-weight:700;font-size:15px\">Safety comes first<\u002Fdiv>\n              <div style=\"display:flex;gap:28px;flex-wrap:wrap\">\n                <div><div style=\"font-family:'Instrument Serif',serif;font-size:52px;line-height:1;color:#C8352E\">{{ s1.red }}<\u002Fdiv><div style=\"font-size:14px;color:#4F5E6B;margin-top:4px\">urgent · clinician same day<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-family:'Instrument Serif',serif;font-size:52px;line-height:1;color:#B7791F\">{{ s1.amber }}<\u002Fdiv><div style=\"font-size:14px;color:#4F5E6B;margin-top:4px\">priority · reviewed within 72 h<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.55;color:#4F5E6B\">Everyone else is called at the rhythm their risk level sets. {{ s1.learn }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ is.s2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:20px 56px;align-items:end\">\n            <h3 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1;margin:0;text-wrap:balance\">Nurses get a ranked call list: most urgent first, in the member’s language.<\u002Fh3>\n            <p style=\"font-size:16px;line-height:1.6;color:#4F5E6B;margin:0;text-wrap:pretty\">Health records stay locked until the member agrees on a recorded call. A script on screen guides every conversation.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;margin-top:28px\">\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:22px 24px\">\n              <div style=\"font-weight:700;font-size:15px\">Nurse capacity in use this cycle<\u002Fdiv>\n              <div style=\"display:flex;align-items:baseline;gap:10px;margin-top:10px\"><span style=\"font-family:'Instrument Serif',serif;font-size:60px;line-height:1\">{{ s2.util }}<\u002Fspan><span style=\"font-size:14px;color:#4F5E6B\">{{ s2.utilTxt }}<\u002Fspan><\u002Fdiv>\n              <div style=\"height:12px;background:#EEEBE4;border-radius:8px;overflow:hidden;margin-top:14px\"><div style=\"height:100%;width:{{ s2.utilW }};background:{{ s2.utilC }};border-radius:8px;transition:width .45s ease\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px\">\n                <div><div style=\"font-size:26px;font-weight:800\">{{ s2.queue }}<\u002Fdiv><div style=\"font-size:13px;color:#4F5E6B\">ready to call<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:26px;font-weight:800\">{{ s2.cap }}<\u002Fdiv><div style=\"font-size:13px;color:#4F5E6B\">calls per 2 weeks<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:26px;font-weight:800;color:#C8352E\">{{ s2.urgent }}<\u002Fdiv><div style=\"font-size:13px;color:#4F5E6B\">urgent or priority<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:22px 24px\">\n              <div style=\"font-weight:700;font-size:15px;margin-bottom:6px\">Next calls on the list<\u002Fdiv>\n              <sc-for list=\"{{ nextCalls }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid #EEEBE4;align-items:center\">\n                  <span style=\"font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};white-space:nowrap\">{{ c.al }}<\u002Fspan>\n                  <span style=\"font-size:14.5px;font-weight:600\">{{ c.action }}<\u002Fspan>\n                  <span><\u002Fspan>\n                  <span style=\"font-size:13px;color:#6E7A84\">{{ c.desc }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ is.s3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:20px 56px;align-items:end\">\n            <h3 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1;margin:0;text-wrap:balance\">Every call ends in one or two clicks, and books the next step.<\u002Fh3>\n            <p style=\"font-size:16px;line-height:1.6;color:#4F5E6B;margin:0;text-wrap:pretty\">A follow-up call, a lab test or a doctor’s review lands on the right day automatically. Outcomes and new claims flow back to care intelligence that night.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;margin-top:28px\">\n            <div style=\"background:#FFFFFF;border-radius:18px;padding:22px 24px\">\n              <div style=\"font-weight:700;font-size:15px;margin-bottom:14px\">From call to commitment · since day 0<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <sc-for list=\"{{ funnel }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:130px minmax(0,1fr) 56px 44px;gap:12px;align-items:center;font-size:14px\">\n                    <span>{{ f.label }}<\u002Fspan>\n                    <div style=\"height:16px;background:#EEEBE4;border-radius:6px;overflow:hidden\"><div style=\"height:100%;width:{{ f.w }};background:#0F766E;border-radius:6px;transition:width .45s ease\"><\u002Fdiv><\u002Fdiv>\n                    <b style=\"text-align:right\">{{ f.n }}<\u002Fb>\n                    <span style=\"font-size:12.5px;color:#6E7A84;text-align:right\">{{ f.pct }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px\">\n                <div><div style=\"font-size:26px;font-weight:800;color:#0F766E\">{{ s3.done }}<\u002Fdiv><div style=\"font-size:13px;color:#4F5E6B\">care actions completed<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:26px;font-weight:800\">{{ s3.decl }}<\u002Fdiv><div style=\"font-size:13px;color:#4F5E6B\">declined, offered again in 90 days<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:26px;font-weight:800\">{{ s3.refused }}<\u002Fdiv><div style=\"font-size:13px;color:#4F5E6B\">said no, never contacted again<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:26px;font-weight:800\">{{ s3.assert }}<\u002Fdiv><div style=\"font-size:13px;color:#4F5E6B\">new facts shared by members<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#ECEAFB;border-radius:18px;padding:22px 24px;border:2px dashed #4B3FB0\">\n              <div style=\"font-weight:700;font-size:15px;color:#4B3FB0\">↩ Going back into care intelligence tonight<\u002Fdiv>\n              <div style=\"font-size:13px;color:#4B3FB0;margin-top:2px\">From the latest round of calls<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px\">\n                <div style=\"background:#FFFFFF;border-radius:14px;padding:14px 16px\"><div style=\"font-family:'Instrument Serif',serif;font-size:40px;line-height:1;color:#4B3FB0\">{{ s3.lDone }}<\u002Fdiv><div style=\"font-weight:700;font-size:14px;margin-top:4px\">completed actions<\u002Fdiv><div style=\"font-size:12.5px;color:#4F5E6B\">close the need, unlock the next<\u002Fdiv><\u002Fdiv>\n                <div style=\"background:#FFFFFF;border-radius:14px;padding:14px 16px\"><div style=\"font-family:'Instrument Serif',serif;font-size:40px;line-height:1;color:#4B3FB0\">{{ s3.lDecl }}<\u002Fdiv><div style=\"font-weight:700;font-size:14px;margin-top:4px\">declined actions<\u002Fdiv><div style=\"font-size:12.5px;color:#4F5E6B\">held 90 days, then offered again<\u002Fdiv><\u002Fdiv>\n                <div style=\"background:#FFFFFF;border-radius:14px;padding:14px 16px\"><div style=\"font-family:'Instrument Serif',serif;font-size:40px;line-height:1;color:#4B3FB0\">{{ s3.lAssert }}<\u002Fdiv><div style=\"font-weight:700;font-size:14px;margin-top:4px\">facts from members<\u002Fdiv><div style=\"font-size:12.5px;color:#4F5E6B\">e.g. a private-clinic result<\u002Fdiv><\u002Fdiv>\n                <div style=\"background:#FFFFFF;border-radius:14px;padding:14px 16px\"><div style=\"font-family:'Instrument Serif',serif;font-size:40px;line-height:1;color:#4B3FB0\">Claims<\u002Fdiv><div style=\"font-weight:700;font-size:14px;margin-top:4px\">labs · refills · visits<\u002Fdiv><div style=\"font-size:12.5px;color:#4F5E6B\">confirm a gap closed, or reopen it<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:14px 0 0;font-size:14px;line-height:1.55;color:#10243A\">The engine re-scores every member and rebuilds tomorrow’s call list. That is one turn of the loop.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"03 What if\" style=\"background:#0B1B2A;color:#F4F2ED\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:88px 32px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px 64px;align-items:end;margin-bottom:36px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5EC4B6\">03 · What if<\u002Fdiv>\n        <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,4.2vw,56px);line-height:1.04;margin:14px 0 0;letter-spacing:-.01em;text-wrap:balance\">Move a lever. See the year change.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size:17px;line-height:1.55;color:#C3CDD6;margin:0;max-width:56ch;text-wrap:pretty\">Outcomes after {{ months }} months, compared with the current plan. The whole page re-runs on your scenario.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px\">\n      <div style=\"background:#10243A;border-radius:28px;padding:28px 30px;display:flex;flex-direction:column;gap:22px\">\n        <sc-for list=\"{{ levers }}\" as=\"l\" hint-placeholder-count=\"5\">\n          <div>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <span style=\"font-size:15px;font-weight:600\">{{ l.label }}<\u002Fspan>\n              <span style=\"font-family:'Instrument Serif',serif;font-size:30px;line-height:1;color:#5EC4B6\">{{ l.txt }}<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" min=\"{{ l.min }}\" max=\"{{ l.max }}\" step=\"{{ l.step }}\" value=\"{{ l.val }}\" sc-camel-on-change=\"{{ l.on }}\" aria-label=\"{{ l.label }}\" style=\"width:100%;margin:10px 0 4px;accent-color:#5EC4B6;cursor:pointer\">\n            <div style=\"font-size:13px;color:#A9B6C2\">{{ l.hint }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ onLevReset }}\" style=\"align-self:flex-start;border:1px solid #2A4257;background:transparent;color:#F4F2ED;padding:10px 18px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer\" style-hover=\"background:#14283A\">Back to the current plan<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"background:#F4F2ED;color:#10243A;border-radius:28px;padding:28px 30px;display:flex;flex-direction:column\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:12px;font-size:12.5px;font-weight:700;color:#6E7A84;padding-bottom:12px;border-bottom:1px solid #DDD8CE\">\n          <span>After {{ months }} months<\u002Fspan><span style=\"text-align:right\">Current plan<\u002Fspan><span style=\"text-align:right\">Your scenario<\u002Fspan><span style=\"text-align:right\">Change<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ compare }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:12px;align-items:baseline;padding:16px 0;border-bottom:1px solid #DDD8CE\">\n            <span style=\"font-size:15px;font-weight:600\">{{ c.label }}<\u002Fspan>\n            <span style=\"text-align:right;font-size:17px;color:#5B6670\">{{ c.base }}<\u002Fspan>\n            <span style=\"text-align:right;font-family:'Instrument Serif',serif;font-size:30px;line-height:1\">{{ c.scen }}<\u002Fspan>\n            <span style=\"text-align:right;font-size:15px;font-weight:800;color:{{ c.col }}\">{{ c.delta }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <p style=\"margin:18px 0 0;font-size:14px;line-height:1.55;color:#4F5E6B;text-wrap:pretty\">{{ compareNote }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 Member\" style=\"max-width:1320px;margin:0 auto;padding:88px 32px 40px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px 64px;align-items:end;margin-bottom:36px\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#0F766E\">04 · One member’s year<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,4.2vw,56px);line-height:1.04;margin:14px 0 0;letter-spacing:-.01em;text-wrap:balance\">Behind every number is a person.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n      <p style=\"font-size:17px;line-height:1.55;color:#4F5E6B;margin:0;max-width:44ch;text-wrap:pretty\">One synthetic member from the top of the call list, followed through every call and claim.<\u002Fp>\n      <button sc-camel-on-click=\"{{ onNextMember }}\" style=\"border:1px solid #CFC9BD;background:#FFFFFF;color:#10243A;padding:10px 18px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer\" style-hover=\"background:#EEEBE4\">Follow another member →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px\">\n    <div style=\"background:#FFFFFF;border-radius:28px;padding:28px 30px;min-width:0\">\n      <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n        <div style=\"width:56px;height:56px;border-radius:50%;background:#10243A;color:#5EC4B6;display:grid;place-items:center;font-family:'Instrument Serif',serif;font-size:26px\">{{ m.initial }}<\u002Fdiv>\n        <div style=\"flex:1;min-width:180px\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:34px;line-height:1.05\">Member {{ m.id }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:#4F5E6B;margin-top:4px\">{{ m.desc }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n          <span style=\"font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px;background:{{ m.tierBg }};color:{{ m.tierFg }}\">{{ m.tierName }} risk<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px;background:{{ m.alBg }};color:{{ m.alFg }}\">{{ m.alName }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:15px;font-weight:700;margin-top:26px\">{{ m.story }}<\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 560 190\" style=\"width:100%;height:auto;display:block;margin-top:12px;font-family:'Hanken Grotesk',sans-serif\">\n        <rect x=\"10\" y=\"{{ mb.b4.y }}\" width=\"540\" height=\"{{ mb.b4.h }}\" fill=\"#F8DCDA\"><\u002Frect>\n        <rect x=\"10\" y=\"{{ mb.b3.y }}\" width=\"540\" height=\"{{ mb.b3.h }}\" fill=\"#FBE5D2\"><\u002Frect>\n        <rect x=\"10\" y=\"{{ mb.b2.y }}\" width=\"540\" height=\"{{ mb.b2.h }}\" fill=\"#F8F0D3\"><\u002Frect>\n        <rect x=\"10\" y=\"{{ mb.b1.y }}\" width=\"540\" height=\"{{ mb.b1.h }}\" fill=\"#E4F2EA\"><\u002Frect>\n        <text x=\"18\" y=\"{{ mb.b4.ty }}\" font-size=\"11\" font-weight=\"700\" fill=\"#7E1E19\">Very high<\u002Ftext>\n        <text x=\"18\" y=\"{{ mb.b3.ty }}\" font-size=\"11\" font-weight=\"700\" fill=\"#7A3F0F\">High<\u002Ftext>\n        <text x=\"18\" y=\"{{ mb.b2.ty }}\" font-size=\"11\" font-weight=\"700\" fill=\"#6B5413\">Moderate<\u002Ftext>\n        <text x=\"18\" y=\"{{ mb.b1.ty }}\" font-size=\"11\" font-weight=\"700\" fill=\"#1F5E3B\">Low<\u002Ftext>\n        <path d=\"{{ mc.d0 }}\" fill=\"none\" stroke=\"#10243A\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpath>\n        <circle cx=\"{{ mc.e0.x }}\" cy=\"{{ mc.e0.y }}\" r=\"6\" fill=\"#10243A\" stroke=\"#FFFFFF\" stroke-width=\"2\"><\u002Fcircle>\n        <text x=\"10\" y=\"184\" font-size=\"11\" fill=\"#6E7A84\">{{ xl.a }}<\u002Ftext>\n        <text x=\"280\" y=\"184\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6E7A84\">{{ xl.c }}<\u002Ftext>\n        <text x=\"550\" y=\"184\" text-anchor=\"end\" font-size=\"11\" fill=\"#6E7A84\">{{ xl.e }}<\u002Ftext>\n      <\u002Fsvg>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid #EEEBE4\">\n        <div><div style=\"font-size:12.5px;color:#6E7A84\">HbA1c<\u002Fdiv><div style=\"font-size:22px;font-weight:800;margin-top:2px\">{{ m.a1c }}<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:12.5px;color:#6E7A84\">Systolic BP<\u002Fdiv><div style=\"font-size:22px;font-weight:800;margin-top:2px\">{{ m.sbp }}<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:12.5px;color:#6E7A84\">Medicines taken<\u002Fdiv><div style=\"font-size:22px;font-weight:800;margin-top:2px\">{{ m.pdc }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border-radius:28px;padding:28px 30px;min-width:0\">\n      <div style=\"font-size:15px;font-weight:700\">What happened · latest first<\u002Fdiv>\n      <sc-if value=\"{{ m.empty }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"font-size:14.5px;line-height:1.55;color:#4F5E6B;margin:14px 0 0\">No contact yet. This member is near the top of the first call list: press Play to watch what happens.<\u002Fp>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;margin-top:12px\">\n        <sc-for list=\"{{ m.log }}\" as=\"e\" hint-placeholder-count=\"0\">\n          <div style=\"display:grid;grid-template-columns:14px 64px minmax(0,1fr);gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid #EEEBE4\">\n            <span style=\"width:10px;height:10px;border-radius:50%;background:{{ e.c }}\"><\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#6E7A84\">{{ e.day }}<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.45\">{{ e.what }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:18px;font-size:13px;color:#6E7A84\">Current focus: {{ m.needs }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"05 Systems\" style=\"max-width:1320px;margin:0 auto;padding:48px 32px 40px\">\n  <div style=\"border-top:1px solid #DDD8CE;padding-top:32px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#0F766E\">05 · Under the hood<\u002Fdiv>\n      <div style=\"font-size:17px;color:#4F5E6B;margin-top:8px\">The systems behind each step, for the technical conversation.<\u002Fdiv>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ onToggleTech }}\" style=\"border:1px solid #CFC9BD;background:#FFFFFF;color:#10243A;padding:10px 18px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer\" style-hover=\"background:#EEEBE4\">{{ techLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n  <sc-if value=\"{{ tech }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin-top:24px\">\n      <div style=\"background:#FFFFFF;border-radius:20px;padding:22px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#0F766E\">01 FIND<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.55;color:#4F5E6B;margin:8px 0 12px\">Cohort rules compile to nGQL over the Daman claims knowledge graph; members land in COHORT_MEMBER with a stable-hash holdout.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#ECEAFB;color:#4B3FB0\">NebulaGraph<\u002Fspan><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#E3EEF7;color:#2B5677\">PostgreSQL<\u002Fspan><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#F8F0D3;color:#6B5413\">ClickHouse<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border-radius:20px;padding:22px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#0F766E\">02 PRIORITISE<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.55;color:#4F5E6B;margin:8px 0 12px\">Nightly score R = clinical + comorbidity + kidney + utilisation + age. 13 DoH-mapped triggers produce the plan, alert and worklist priority.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#F8F0D3;color:#6B5413\">ClickHouse<\u002Fspan><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#E3F1EF;color:#0F5E57\">Elasticsearch<\u002Fspan><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#E3EEF7;color:#2B5677\">PostgreSQL<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border-radius:20px;padding:22px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#0F766E\">03 ENGAGE<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.55;color:#4F5E6B;margin:8px 0 12px\">Care portal worklist with a consent gate: Member 360 stays blocked until CONSENT_EVENT is logged. Calls placed and recorded in Genesys.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#F8E1EE;color:#8A2B5F\">Genesys<\u002Fspan><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#E3EEF7;color:#2B5677\">PostgreSQL<\u002Fspan><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#F8F0D3;color:#6B5413\">ClickHouse<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border-radius:20px;padding:22px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#4B3FB0\">04 LEARN<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.55;color:#4F5E6B;margin:8px 0 12px\">DISPOSITION, ASSERTION and CARE_GAP events are written back; a nightly Spark scan refreshes MEMBER_FEATURE and re-scores everyone.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#FBE5D2;color:#7A3F0F\">Spark<\u002Fspan><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#E3EEF7;color:#2B5677\">PostgreSQL<\u002Fspan><span style=\"font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#F8F0D3;color:#6B5413\">ClickHouse<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n\n<footer style=\"max-width:1320px;margin:0 auto;padding:24px 32px 56px;font-size:13px;line-height:1.6;color:#6E7A84\">\n  Simulation with synthetic members and a fixed seed: the same inputs always give the same result. Each round is a two-week cycle. Rules follow the final risk matrix of 09-11-2026. Not real member data.\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;horizonMonths&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;6&quot;,&quot;12&quot;,&quot;24&quot;],&quot;default&quot;:&quot;12&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Simulation&quot;},&quot;cohortSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:300,&quot;min&quot;:100,&quot;max&quot;:1000,&quot;step&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Simulation&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Simulation&quot;}}\">\nclass Component extends DCLogic {\n  C = {\n    TIERN: ['', 'Low', 'Moderate', 'High', 'Very high'],\n    TC: { 1: ['#E4F2EA', '#1F5E3B'], 2: ['#F8F0D3', '#6B5413'], 3: ['#FBE5D2', '#7A3F0F'], 4: ['#F8DCDA', '#7E1E19'] },\n    MIX: ['#7FBF9A', '#E2C46A', '#E59A5C', '#C8352E'],\n    AL: { RED: ['Urgent', '#F8DCDA', '#7E1E19'], AMBER: ['Priority', '#FBE5D2', '#7A3F0F'], YELLOW: ['Needs attention', '#F8F0D3', '#6B5413'], GREEN: ['On track', '#E4F2EA', '#1F5E3B'] },\n    CAD: ['', 'Check-in every 3 months', 'Call about every 2 months', 'Monthly, then case management', 'Weekly, then every 2–4 weeks'],\n    DEF: { nurses: 1, calls: 48, reach: 60, consent: 80, done: 65, hold: 10 },\n    KC: { nr: '#A9B1B8', consent: '#0F766E', refused: '#C8352E', red: '#C8352E', done: '#0F766E', decl: '#B7791F', carried: '#A9B1B8', assert: '#4B3FB0', adm: '#C8352E' }\n  };\n  state = { ready: false, stage: 0, playing: false, lev: { nurses: 1, calls: 48, reach: 60, consent: 80, done: 65, hold: 10 }, tick: 0, trace: 0, tech: false };\n\n  componentDidMount() {\n    const go = () => {\n      if (!window.CCLSim) { this.wait = setTimeout(go, 40); return; }\n      this.rebuildAll(this.state.lev, 0);\n      this.setState({ ready: true });\n      if (this.props.autoplay) setTimeout(() => this.play(), 600);\n    };\n    go();\n  }\n  componentDidUpdate(pp) {\n    if (!this.sim) return;\n    if (pp.horizonMonths !== this.props.horizonMonths || pp.cohortSize !== this.props.cohortSize) {\n      this.stop(); this.baseKey = null;\n      this.rebuildAll(this.state.lev, Math.min(this.sim.IT, this.H())); this.forceUpdate();\n    }\n  }\n  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.wait); }\n  months() { const m = +this.props.horizonMonths; return [6, 12, 24].includes(m) ? m : 12; }\n  H() { return Math.round(this.months() * 26 / 12); }\n  opts(lev) { const n = +this.props.cohortSize; return Object.assign({ n: n >= 50 && n <= 2000 ? n : 300 }, lev); }\n  rebuildAll(lev, it) {\n    const S = window.CCLSim, H = this.H();\n    this.sim = S.createSim(this.opts(lev)); this.sim.setTrace(this.state.trace); this.sim.run(it);\n    this.hz = S.createSim(this.opts(lev)); this.hz.setTrace(this.state.trace); this.hz.run(H); this.hzS = this.hz.summary();\n    const key = H + '|' + this.opts({}).n;\n    if (this.baseKey !== key) { this.hzB = S.createSim(this.opts(this.C.DEF)).run(H).summary(); this.baseKey = key; }\n  }\n  stop = () => { clearInterval(this.timer); this.timer = null; if (this.state.playing) this.setState({ playing: false }); };\n  play = () => {\n    if (!this.sim) return;\n    if (this.timer) { this.stop(); return; }\n    if (this.sim.IT >= this.H()) this.rebuildAll(this.state.lev, 0);\n    this.setState({ playing: true, tick: this.sim.IT });\n    this.timer = setInterval(() => {\n      if (this.sim.IT >= this.H()) { this.stop(); return; }\n      this.sim.step(); this.setState({ tick: this.sim.IT });\n    }, 520);\n  };\n  stepOnce = () => { if (!this.sim) return; this.stop(); if (this.sim.IT >= this.H()) return; this.sim.step(); this.setState({ tick: this.sim.IT }); };\n  reset = () => { if (!this.sim) return; this.stop(); this.rebuildAll(this.state.lev, 0); this.setState({ tick: 0 }); };\n  setLev = k => e => { const lev = Object.assign({}, this.state.lev, { [k]: +e.target.value }); this.rebuildAll(lev, this.sim.IT); this.setState({ lev }); };\n  levReset = () => { const lev = Object.assign({}, this.C.DEF); this.rebuildAll(lev, this.sim.IT); this.setState({ lev }); };\n  nextMember = () => { const t = this.state.trace + 1; this.sim.setTrace(t); this.hz.setTrace(t); this.hzS = this.hz.summary(); this.setState({ trace: t }); };\n\n  chart(series, range, o) {\n    const all = range.flat().concat(series.flat());\n    let mn, mx;\n    if (o.lo != null) { mn = o.lo; mx = o.hi; }\n    else if (o.fit) { mn = Math.min(...all); mx = Math.max(...all); const pad = Math.max(0.3, (mx - mn) * 0.15); mn = Math.floor((mn - pad) * 2) / 2; mx = Math.ceil((mx + pad) * 2) / 2; }\n    else { mn = 0; mx = Math.ceil(Math.max(4, ...all) * 1.12 / 4) * 4; }\n    const pw = o.W - o.pl - o.pr, ph = o.H - o.pt - o.pb, f = n => n.toFixed(1);\n    const x = i => o.pl + i / o.N * pw, y = v => o.pt + (1 - (v - mn) / (mx - mn)) * ph;\n    const pts = series.map(s => s.map((v, i) => [x(i), y(v)]));\n    const d = p => p.map((q, i) => (i ? 'L' : 'M') + f(q[0]) + ' ' + f(q[1])).join(' ');\n    const out = { grid: '', cx: f(x(series[0].length - 1)), y };\n    [0, 1, 2, 3, 4].forEach(g => { const v = mn + (mx - mn) * g / 4, yy = y(v); out['t' + g] = { y: f(yy + 4), l: o.fmt(v) }; out.grid += 'M' + o.pl + ' ' + f(yy) + ' H' + (o.W - o.pr) + ' '; });\n    pts.forEach((p, j) => { out['d' + j] = d(p); const q = p[p.length - 1]; out['e' + j] = { x: f(q[0]), y: f(q[1]), lx: f(q[0] + 12), ly: q[1] + 5 }; });\n    out.area = pts.length > 1 && pts[0].length > 1 ? d(pts[0]) + ' ' + pts[1].slice().reverse().map(q => 'L' + f(q[0]) + ' ' + f(q[1])).join(' ') + ' Z' : '';\n    return out;\n  }\n\n  renderVals() {\n    const C = this.C, st = this.state;\n    const pick = i => () => this.setState({ stage: i });\n    const base = { onPlay: this.play, onStep: this.stepOnce, onReset: this.reset, onNextMember: this.nextMember, onLevReset: this.levReset,\n      onToggleTech: () => this.setState({ tech: !st.tech }), tech: st.tech, techLabel: st.tech ? 'Hide systems' : 'Show systems',\n      pick0: pick(0), pick1: pick(1), pick2: pick(2), pick3: pick(3), months: this.months() };\n    if (!st.ready || !this.sim) return Object.assign(base, { ready: false, playLabel: 'Loading…', is: { s0: true } });\n\n    const s = this.sim.summary(), hz = this.hzS, hb = this.hzB, H = this.H(), IT = s.IT, ran = IT > 0, done = IT >= H;\n    const last = s.hist[s.hist.length - 1], first = s.hist[0];\n    const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(1);\n    const M = this.months(), fmtN = n => Math.round(n).toLocaleString('en-US');\n\n    const xl = { a: 'Start', b: (M / 4) + ' mo', c: (M / 2) + ' mo', d: (M * 3 / 4) + ' mo', e: M + ' mo' };\n    const mainC = this.chart([s.hist.map(h => h.rT), s.hist.map(h => h.rH)], [hz.hist.map(h => h.rT), hz.hist.map(h => h.rH)],\n      { W: 760, H: 300, pl: 44, pr: 104, pt: 16, pb: 36, N: H, fit: true, fmt: v => v.toFixed(1) });\n    let yT = mainC.e0.ly, yH = mainC.e1.ly;\n    if (Math.abs(yT - yH) < 18) { const mid = (yT + yH) / 2; if (yT <= yH) { yT = mid - 9; yH = mid + 9; } else { yT = mid + 9; yH = mid - 9; } }\n    mainC.e0.ly = yT.toFixed(1); mainC.e1.ly = yH.toFixed(1);\n    const sm = { W: 380, H: 170, pl: 34, pr: 14, pt: 12, pb: 28, N: H, fmt: v => Math.round(v) };\n    const c2 = this.chart([s.hist.map(h => h.red), s.hist.map(h => h.amber)], [hz.hist.map(h => h.red), hz.hist.map(h => h.amber), hb.hist.map(h => h.amber)], sm);\n    const c3 = this.chart([s.hist.map(h => h.gapsOpen), s.hist.map(h => h.closed)], [hz.hist.map(h => h.gapsOpen), hz.hist.map(h => h.closed)], sm);\n\n    const nodes = {};\n    [0, 1, 2, 3].forEach(i => { const on = st.stage === i, col = i === 3 ? '#A79BFF' : '#5EC4B6';\n      nodes['n' + i] = { fill: on ? col : '#0B1B2A', num: on ? '#0B1B2A' : '#F4F2ED', halo: on ? (i === 3 ? 'rgba(167,155,255,.18)' : 'rgba(94,196,182,.18)') : 'transparent' };\n      nodes['st' + i] = { bg: on ? '#10243A' : '#FFFFFF', fg: on ? '#F4F2ED' : '#10243A', sub: on ? '#C3CDD6' : '#6E7A84', num: on ? col : (i === 3 ? '#4B3FB0' : '#0F766E') }; });\n\n    const pulse = ran ? React.createElement('circle', { key: 'p' + IT + '-' + st.lev.calls + st.lev.reach + st.lev.consent + st.lev.done + st.lev.hold, r: 7, fill: '#A79BFF' },\n      React.createElement('animateMotion', { dur: st.playing ? '0.5s' : '1.6s', fill: 'freeze', path: 'M270 90 A150 150 0 1 1 269.9 90' }),\n      React.createElement('animate', { attributeName: 'opacity', values: '1;1;0', dur: st.playing ? '0.5s' : '1.6s', fill: 'freeze' })) : null;\n\n    const tiers = [1, 2, 3, 4].map(t => ({ n: s.tiers[t - 1], name: C.TIERN[t] + ' risk', cad: C.CAD[t], bg: C.TC[t][0], fg: C.TC[t][1] }));\n    const tot = s.tiers.reduce((a, b) => a + b, 0) || 1;\n    const mixOf = arr => arr.map((n, i) => ({ f: n / tot, bg: C.MIX[i], name: C.TIERN[i + 1], n, n0: s.tiers0[i] }));\n    const topMax = s.top.length ? s.top[0].n : 1;\n    const util = Math.min(1, s.queue / s.cap);\n    const capTxt = fmtN(s.cap);\n\n    const fun = [['Calls made', s.cum.calls], ['Member answered', s.cum.reached], ['Agreed to join', s.cum.consent]];\n    const funnel = fun.map((f, i) => ({ label: f[0], n: fmtN(f[1]), w: (s.cum.calls ? Math.max(2, f[1] / s.cum.calls * 100) : 0) + '%', pct: i && fun[i - 1][1] ? Math.round(f[1] / fun[i - 1][1] * 100) + '%' : '' }));\n\n    const L = st.lev;\n    const levers = [\n      ['calls', 'Team calls per day', 5, 60, 1, L.calls, v => v + '', v => fmtN(v * 10) + ' calls every two weeks'],\n      ['reach', 'Members who answer', 20, 95, 5, L.reach, v => v + '%', () => 'Better timing and language match lift this'],\n      ['consent', 'Who agree to join', 40, 100, 5, L.consent, v => v + '%', () => 'Share of answered members who consent'],\n      ['done', 'Actions completed', 20, 95, 5, L.done, v => v + '%', () => 'Share of care actions members follow through'],\n      ['hold', 'Control group', 5, 30, 5, L.hold, v => v + '%', () => 'Bigger control = stronger proof, fewer members helped']\n    ].map(a => ({ key: a[0], label: a[1], min: a[2], max: a[3], step: a[4], val: a[5], txt: a[6](a[5]), hint: a[7](a[5]), on: this.setLev(a[0]) }));\n    const isBase = Object.keys(C.DEF).every(k => C.DEF[k] === L[k]);\n    const rows = [['Care gaps closed', hb.closed, hz.closed, 0], ['Care actions completed', hb.cum.done, hz.cum.done, 0], ['Members enrolled', hb.cum.consent, hz.cum.consent, 0], ['Risk points below control', hb.diff, hz.diff, 1], ['Members moved to lower risk', hb.down, hz.down, 0]];\n    const compare = rows.map(r => { const dl = r[2] - r[1], dec = r[3];\n      return { label: r[0], base: dec ? r[1].toFixed(1) : fmtN(r[1]), scen: dec ? r[2].toFixed(1) : fmtN(r[2]), delta: isBase || Math.abs(dl) < (dec ? 0.05 : 0.5) ? '—' : (dl > 0 ? '+' : '−') + (dec ? Math.abs(dl).toFixed(1) : fmtN(Math.abs(dl))), col: isBase || Math.abs(dl) < (dec ? 0.05 : 0.5) ? '#6E7A84' : dl > 0 ? '#0F766E' : '#C8352E' }; });\n\n    const m = s.member, hm = hz.member;\n    const yMax = Math.max(16, ...hm.traj, ...m.traj) + 1;\n    const mc = this.chart([m.traj], [hm.traj], { W: 560, H: 190, pl: 10, pr: 10, pt: 10, pb: 26, N: H, lo: 0, hi: yMax, fmt: v => v });\n    const band = (lo, hi) => { const y1 = mc.y(hi), y2 = mc.y(lo); return { y: y1.toFixed(1), h: (y2 - y1).toFixed(1), ty: (y1 + 15).toFixed(1) }; };\n    const mb = { b4: band(12.5, yMax), b3: band(7.5, 12.5), b2: band(3.5, 7.5), b1: band(0, 3.5) };\n    const al = C.AL[m.alert];\n    const story = !ran ? 'Starts at ' + C.TIERN[m.tier0].toLowerCase() + ' risk, score ' + m.R0 + '.' :\n      m.tier < m.tier0 ? 'Down from ' + C.TIERN[m.tier0].toLowerCase() + ' to ' + C.TIERN[m.tier].toLowerCase() + ' risk · score ' + m.R0 + ' → ' + m.R :\n      m.tier > m.tier0 ? 'Up from ' + C.TIERN[m.tier0].toLowerCase() + ' to ' + C.TIERN[m.tier].toLowerCase() + ' risk · score ' + m.R0 + ' → ' + m.R :\n      'Holding at ' + C.TIERN[m.tier].toLowerCase() + ' risk · score ' + m.R0 + ' → ' + m.R;\n\n    const diff = s.diff;\n    return Object.assign(base, nodes, {\n      ready: true, day: IT * 14, dayOf: H * 14, roundTxt: 'round ' + IT + ' of ' + H, progress: (IT / H * 100).toFixed(1) + '%',\n      playLabel: st.playing ? '❚❚  Pause' : done ? '↻  Replay the year' : ran ? '▶  Resume' : '▶  Play the year',\n      nTxt: 'simulation of ' + s.n + ' synthetic members',\n      k1: ran ? diff.toFixed(1) : '—', k2: ran ? fmtN(last.closed) : '—', k3: ran ? fmtN(s.cum.done) : '—', k4: ran ? fmtN(s.cum.consent) : '—',\n      heroHint: st.playing ? 'Simulating two weeks every half second…' : done ? M + ' months simulated. Scroll down for the proof.' : ran ? 'Paused at day ' + IT * 14 + '. Press Resume or step two weeks at a time.' : 'Press Play to simulate the first ' + M + ' months, two weeks at a time.',\n      r0: fmtN(s.treated) + ' members', r1: fmtN(s.flagged) + ' needs flagged',\n      r2: ran ? fmtN(s.last.calls) + ' calls this cycle' : fmtN(Math.min(s.queue, s.cap)) + ' ready to call',\n      r3: ran ? fmtN(s.last.done) + ' actions done' : 'waiting for calls',\n      ringSub: !ran ? 'of ' + H * 14 + ' · press Play' : diff > 0.05 ? diff.toFixed(1) + ' pts less risk build-up' : 'gap not visible yet',\n      ringSub2: ran && diff > 0.05 ? 'than the control group' : '',\n      pulse,\n      proofTitle: !ran ? 'Same starting point. Now watch the gap open.' : diff >= 0.3 ? 'The members we call are pulling away from the control group.' : 'Early days: the gap takes a few months of claims to show.',\n      ch: mainC, xl, endT: 'Called ' + last.rT.toFixed(1), endH: 'Control ' + last.rH.toFixed(1),\n      p: { rT: last.rT.toFixed(1), rT0: first.rT.toFixed(1), dT: sign(last.rT - first.rT), rH: last.rH.toFixed(1), rH0: first.rH.toFixed(1), dH: sign(last.rH - first.rH),\n        note: ran ? 'Risk rises naturally with age and time. Members we call rise ' + (last.rT - first.rT).toFixed(1) + ' points; the control group rises ' + (last.rH - first.rH).toFixed(1) + '. A gap only counts once labs, visits or refills show up in claims.' : 'Measured against a control group, so we prove impact, not just activity.' },\n      c2, c2v: { a: last.red, b: last.amber }, c3, c3v: { a: fmtN(last.gapsOpen), b: fmtN(last.closed) },\n      mix0: mixOf(s.tiers0), mix: mixOf(s.tiers),\n      is: { s0: st.stage === 0, s1: st.stage === 1, s2: st.stage === 2, s3: st.stage === 3 },\n      s0: { treated: fmtN(s.treated), both: fmtN(s.both), split: s.dmOnly + ' · ' + s.htnOnly, holdout: fmtN(s.holdout), holdPct: L.hold },\n      tiers, top: s.top.map(r => ({ label: r.label, n: r.n, w: (r.n / topMax * 100).toFixed(1) + '%' })),\n      s1: { red: s.red, amber: s.amber, learn: ran ? 'Last night the engine learned from ' + s.last.done + ' completed actions, ' + s.last.decl + ' declines and ' + s.last.assert + ' member-reported facts.' : '' },\n      s2: { util: Math.round(util * 100) + '%', utilTxt: util >= 0.95 ? 'at the limit: add capacity' : 'headroom to take more members', utilW: (util * 100).toFixed(1) + '%', utilC: util >= 0.95 ? '#C8352E' : '#0F766E', queue: fmtN(s.queue), cap: capTxt, urgent: s.urgentQ },\n      nextCalls: s.next.map(c => ({ al: C.AL[c.alert][0], bg: C.AL[c.alert][1], fg: C.AL[c.alert][2], action: c.action, desc: c.lang + '-speaking member · ' + C.TIERN[c.tier].toLowerCase() + ' risk · ' + c.need.toLowerCase() })),\n      funnel, s3: { done: fmtN(s.cum.done), decl: fmtN(s.cum.decl), refused: fmtN(s.cum.refused), assert: fmtN(s.cum.assert), lDone: s.last.done, lDecl: s.last.decl, lAssert: s.last.assert },\n      levers, compare,\n      compareNote: isBase ? 'This is the current plan. Move any lever to compare a different investment.' : 'Simulated on the same members with the same seed, so differences come from your levers, not chance draws.',\n      m: { id: m.id, initial: m.sex === 'Man' ? 'M' : 'W', desc: m.cond + ' · ' + m.sex.toLowerCase() + ', ' + m.age + ' · speaks ' + m.lang + ' · ' + m.net.toLowerCase(),\n        tierName: C.TIERN[m.tier], tierBg: C.TC[m.tier][0], tierFg: C.TC[m.tier][1], alName: al[0], alBg: al[1], alFg: al[2], story,\n        a1c: m.a1c == null ? '—' : m.a1c + '%', sbp: m.sbp + ' mmHg', pdc: m.pdc + '%',\n        empty: m.log.length === 0, log: m.log.slice(0, 7).map(e => ({ day: 'Day ' + e.it * 14, what: e.what, c: C.KC[e.kind] || '#A9B1B8' })),\n        needs: m.needs.length ? m.needs.join(' · ') : 'nothing open' },\n      mc, mb\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
